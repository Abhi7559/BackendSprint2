<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Catalogue - Live Search</title>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #f59e0b;
            --tag-bg: #27272a;
            --tag-text: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #a5b4fc, #6366f1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .search-box {
            position: relative;
            margin-bottom: 2rem;
        }

        .search-input {
            width: 100%;
            padding: 0.85rem 1.2rem;
            font-size: 1rem;
            border-radius: 0.75rem;
            border: 1px solid var(--card-border);
            background-color: var(--card-bg);
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        .search-indicator {
            position: absolute;
            right: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            display: none;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .htmx-request .search-indicator {
            display: inline-block;
        }

        #film-results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.25rem;
            min-height: 150px;
        }

        .film-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 0.75rem;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .film-card:hover {
            transform: translateY(-2px);
            border-color: #475569;
        }

        .film-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .film-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .badge-genre {
            background-color: var(--tag-bg);
            color: var(--tag-text);
            padding: 0.2rem 0.5rem;
            border-radius: 0.375rem;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .rating-badge {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            color: var(--accent);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .film-director {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: auto;
            border-top: 1px solid var(--card-border);
            padding-top: 0.5rem;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
            background-color: rgba(30, 41, 59, 0.4);
            border: 1px dashed var(--card-border);
            border-radius: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Staff Film Catalogue</h1>
            <p class="subtitle">Live HTMX-driven search without client-side frameworks</p>
        </header>

        <div class="search-box">
            <input 
                id="search-input"
                class="search-input"
                type="text" 
                name="q" 
                placeholder="Type to search films by title or genre..." 
                autocomplete="off"
                hx-get="/ui/films/search"
                hx-trigger="input changed delay:300ms, search"
                hx-target="#film-results"
                hx-swap="innerHTML"
                hx-indicator="#loading-spinner"
            />
            <span id="loading-spinner" class="search-indicator">Searching...</span>
        </div>

        <!-- Results area: automatically loads all films on initial page load using reusable fragment endpoint -->
        <div 
            id="film-results"
            hx-get="/ui/films/search"
            hx-trigger="load"
            hx-swap="innerHTML"
        >
            <div class="empty-state">
                <p>Loading films...</p>
            </div>
        </div>
    </div>
</body>
</html>
