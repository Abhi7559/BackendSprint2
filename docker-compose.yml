services:
  web:
    build: .
    container_name: film_review_api_day4
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://user:password@db:5432/film_review
      - RUN_SEED=true
    depends_on:
      db:
        condition: service_healthy
    command: ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  db:
    image: postgres:16-alpine
    container_name: film_review_db_day4
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: film_review
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d film_review"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
